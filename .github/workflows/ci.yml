name: CI Quality Gate and Security Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Job 1: Check for exposed secrets, API keys, or credentials
  secret-scanning:
    name: Security - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog needs full history to scan commits properly

      - name: Scan Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog-enterprise-github-action@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # Job 2: Run Cypress End-to-End Tests as a Quality Gate
  cypress-tests:
    name: Quality - Cypress E2E
    runs-on: ubuntu-latest
    needs: secret-scanning # Ensures secrets scan passes first
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Cypress E2E Tests (Headless)
        uses: cypress-io/github-action@v6
        with:
          # If your app runs on a local static server, start it here:
          start: npm run start
          wait-on: 'http://localhost:3000' # Change to match your server port
          browser: chrome