<html data-type="html" data-identifier="924f8027-0c2c-4e51-b2cd-1665b002b55b" data-title="login.html – White Theme" data-version="1" width="1200" height="700"><head></head><body style="margin:0;padding:0;font-family:Arial,sans-serif;">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#f5f3ff 0%,#fdf2f8 50%,#eff6ff 100%);
    padding:32px 16px;position:relative;overflow:hidden;}
  .auth-page::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;
    border-radius:50%;background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(236,72,153,.08));pointer-events:none;}
  .auth-page::after{content:'';position:absolute;bottom:-100px;left:-100px;width:300px;height:300px;
    border-radius:50%;background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(124,58,237,.06));pointer-events:none;}
  .auth-card{max-width:460px;width:100%;background:#fff;border-radius:20px;padding:40px;
    box-shadow:0 8px 40px rgba(124,58,237,.12),0 2px 10px rgba(0,0,0,.06);
    border:1.5px solid #ede9fe;position:relative;z-index:1;}
  .auth-logo{width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;}
  .auth-title{font-size:26px;font-weight:bold;color:#1e1b4b;text-align:center;margin-bottom:6px;}
  .auth-sub{font-size:14px;color:#6b7280;text-align:center;margin-bottom:28px;}
  .form-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;}
  .form-control{width:100%;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;
    padding:12px 14px;font-size:14px;color:#111827;outline:none;font-family:Arial,sans-serif;transition:.2s;}
  .form-control:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1);background:#fff;}
  .input-group{display:flex;gap:0;}
  .input-group .form-control{border-radius:8px 0 0 8px;flex:1;}
  .input-group .eye-btn{background:#f9fafb;border:1.5px solid #e5e7eb;border-left:none;
    border-radius:0 8px 8px 0;padding:12px 14px;cursor:pointer;color:#6b7280;font-size:16px;}
  .input-group .eye-btn:hover{background:#f3f4f6;}
  .mb-3{margin-bottom:16px;}
  .check-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .check-row label{font-size:13px;color:#374151;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .check-row a{font-size:13px;color:#7c3aed;text-decoration:none;font-weight:600;}
  .btn-submit{width:100%;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;
    border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:bold;
    cursor:pointer;font-family:Arial,sans-serif;transition:.2s;
    box-shadow:0 4px 16px rgba(124,58,237,.3);}
  .btn-submit:hover{opacity:.9;}
  .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .alert-success{background:#dcfce7;border:1px solid #bbf7d0;color:#166534;}
  .alert-danger{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;}
  .auth-footer{text-align:center;margin-top:20px;font-size:14px;color:#6b7280;}
  .auth-footer a{color:#7c3aed;font-weight:bold;text-decoration:none;}
  .divider{text-align:center;color:#9ca3af;font-size:12px;margin:20px 0;position:relative;}
  .divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:#e5e7eb;}
  .divider::before{left:0;}.divider::after{right:0;}
</style>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" style="text-decoration:none;display:block;text-align:center;margin-bottom:16px;">
      <div class="auth-logo">📖</div>
      <h1 class="auth-title">Book Haven v3</h1>
    </a>
    <p class="auth-sub">Welcome back, reader. Sign in to continue your journey.</p>

    <div id="loginAlert" class="alert" style="display:none;"></div>

    <form id="loginForm" novalidate="">
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required="">
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required="">
          <button class="eye-btn" type="button" id="toggleLoginPassword">👁</button>
        </div>
      </div>
      <div class="check-row">
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn-submit">Login →</button>
    </form>

    <div class="divider">or</div>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<script>
  document.getElementById("toggleLoginPassword").addEventListener("click", function() {
    var p = document.getElementById("loginPassword");
    p.type = p.type === "password" ? "text" : "password";
    this.textContent = p.type === "password" ? "👁" : "🙈";
  });
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    var email = document.getElementById("loginEmail").value.trim();
    var pass  = document.getElementById("loginPassword").value.trim();
    var alert = document.getElementById("loginAlert");
    if (!email || !pass) {
      alert.className = "alert alert-danger"; alert.style.display = "block";
      alert.textContent = "Please fill in your email and password correctly."; return;
    }
    alert.className = "alert alert-success"; alert.style.display = "block";
    alert.textContent = "Login successful! Redirecting to Home...";
    setTimeout(function(){ window.location.href = "index.html"; }, 1200);
  });
</script>

</body></html>
